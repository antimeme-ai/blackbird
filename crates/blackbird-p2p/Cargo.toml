[package]
name = "blackbird-p2p"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "Narrow panic-safe C-ABI staticlib wrapping iroh v1.5.0 QUIC + TLS 1.3 Mutual RPK for Blackbird P2P parties"

[lib]
name = "blackbird_p2p"
crate-type = ["staticlib", "lib"]

[dependencies]
bytes = "1.11"
iroh = { version = "1.5.0", default-features = false, features = ["tls-ring", "fast-apple-datapath"] }
tokio = { version = "1.44", features = ["rt-multi-thread", "sync", "time", "io-util"] }
url = "2.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = false
