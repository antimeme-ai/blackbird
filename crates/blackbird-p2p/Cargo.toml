[package]
name = "blackbird-p2p"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "Unified panic-safe C-ABI staticlib wrapping iroh v1.5.0 P2P and mp-mls (OpenMLS 0.9.2) for Blackbird"

[lib]
name = "blackbird_p2p"
crate-type = ["staticlib", "lib"]

[dependencies]
bytes = "1.11"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }
iroh = { version = "1.5.0", default-features = false, features = ["tls-ring", "fast-apple-datapath"] }
mp-mls = { path = "../mp-mls" }
openmls_traits = "=0.6.0"
tokio = { version = "1.44", features = ["rt-multi-thread", "sync", "time", "io-util"] }
url = "2.5"
zeroize = { version = "1.9", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = false
