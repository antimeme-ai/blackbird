name: Release Prebuilt Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
            macos_deployment_target: '15.0'
          - os: ubuntu-24.04
            target: linux-x86_64
            macos_deployment_target: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve and validate release version
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            ver="${INPUT_VERSION}"
          else
            ver="${GITHUB_REF_NAME}"
          fi
          case "$ver" in
            v)
              echo "Invalid release version: $ver" >&2
              exit 2 ;;
            v*[!0-9A-Za-z._-]*|*..*|*/*)
              echo "Invalid release version: $ver" >&2
              exit 2 ;;
            v*) ;;
            *)
              echo "Release version must start with 'v': $ver" >&2
              exit 2 ;;
          esac
          printf 'version=%s\n' "$ver" >> "$GITHUB_OUTPUT"

      - name: Run offline release packaging regression checks
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/check-release-packaging

      - name: Install macOS build toolchain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake ninja llvm openssl@3
          # Build pinned Lua 5.5.1 static library with mandatory SHA-256 verification.
          if ! lua -v 2>/dev/null | grep -q '5\.5\.1'; then
            tmpdir="$(mktemp -d)"
            trap 'rm -rf "$tmpdir"' EXIT
            curl -fsSL --proto '=https' --tlsv1.2 \
              https://www.lua.org/ftp/lua-5.5.1.tar.gz -o "$tmpdir/lua-5.5.1.tar.gz"
            printf '%s  %s\n' \
              '1c4b4068d67061f2a2231ad2b5422e77acea1487ea9890f6320af614f4373dce' \
              "$tmpdir/lua-5.5.1.tar.gz" | shasum -a 256 -c -
            tar -xzf "$tmpdir/lua-5.5.1.tar.gz" -C "$tmpdir"
            make -C "$tmpdir/lua-5.5.1" macosx -j4
            sudo make -C "$tmpdir/lua-5.5.1" install
          fi
          # Put $HOME/.cargo/bin ahead of /opt/homebrew/opt/llvm/bin on PATH
          # (GitHub Actions prepends GITHUB_PATH entries in file order).
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
          echo "OPENSSL_ROOT_DIR=/opt/homebrew/opt/openssl@3" >> "$GITHUB_ENV"

      - name: Install Linux build toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl gnupg lsb-release ninja-build cmake \
            libssl-dev pkg-config build-essential
          # Install LLVM/Clang 23 + libc++ 23 from the official LLVM APT repository.
          curl -fsSL --proto '=https' --tlsv1.2 https://apt.llvm.org/llvm-snapshot.gpg.key | \
            sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          codename="$(lsb_release -cs)"
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-23 main" | \
            sudo tee /etc/apt/sources.list.d/llvm-23.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-23 lld-23 libc++-23-dev libc++abi-23-dev libunwind-23-dev
          echo "CC=/usr/bin/clang-23" >> "$GITHUB_ENV"
          echo "CXX=/usr/bin/clang++-23" >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # Install pinned CMake 4.3.0 (FindLua 5.5 support) with mandatory SHA-256 verification.
          if ! cmake --version 2>/dev/null | grep -q '4\.3\.0'; then
            cmake_tmp="$(mktemp -d)"
            curl -fsSL --proto '=https' --tlsv1.2 \
              https://github.com/Kitware/CMake/releases/download/v4.3.0/cmake-4.3.0-linux-x86_64.tar.gz \
              -o "$cmake_tmp/cmake-4.3.0-linux-x86_64.tar.gz"
            printf '%s  %s\n' \
              '201bdabe17a54e017f119cffa247648e9c44327e52473c2cc60a88fded94652a' \
              "$cmake_tmp/cmake-4.3.0-linux-x86_64.tar.gz" | sha256sum -c -
            sudo tar -xzf "$cmake_tmp/cmake-4.3.0-linux-x86_64.tar.gz" --strip-components=1 -C /usr/local
            rm -rf "$cmake_tmp"
          fi
          cmake --version
          # Build pinned Lua 5.5.1 with mandatory SHA-256 verification.
          if ! lua -v 2>/dev/null | grep -q '5\.5\.1'; then
            tmpdir="$(mktemp -d)"
            trap 'rm -rf "$tmpdir"' EXIT
            curl -fsSL --proto '=https' --tlsv1.2 \
              https://www.lua.org/ftp/lua-5.5.1.tar.gz -o "$tmpdir/lua-5.5.1.tar.gz"
            printf '%s  %s\n' \
              '1c4b4068d67061f2a2231ad2b5422e77acea1487ea9890f6320af614f4373dce' \
              "$tmpdir/lua-5.5.1.tar.gz" | sha256sum -c -
            tar -xzf "$tmpdir/lua-5.5.1.tar.gz" -C "$tmpdir"
            make -C "$tmpdir/lua-5.5.1" linux -j4
            sudo make -C "$tmpdir/lua-5.5.1" install
          fi

      - name: Install stable Rust toolchain (>= 1.91 for edition 2024 / OpenMLS)
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Rust/Cargo toolchain for iroh P2P and MLS support
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cargo >/dev/null 2>&1; then
            echo "cargo not found on PATH; refusing to build release without iroh P2P support" >&2
            exit 1
          fi
          cargo --version
          rustc --version

      - name: Build, smoke-check, and package release tarball
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          MACOS_TARGET: ${{ matrix.macos_deployment_target }}
        run: |
          set -euo pipefail
          args=(--version "$RELEASE_VERSION" --out-dir dist --jobs 4)
          if [ -n "$MACOS_TARGET" ]; then
            args+=(--macos-deployment-target "$MACOS_TARGET")
          fi
          ./scripts/package-release "${args[@]}"

      - name: Upload packaged release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve and validate release version
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            ver="${INPUT_VERSION}"
          else
            ver="${GITHUB_REF_NAME}"
          fi
          case "$ver" in
            v)
              echo "Invalid release version: $ver" >&2
              exit 2 ;;
            v*[!0-9A-Za-z._-]*|*..*|*/*)
              echo "Invalid release version: $ver" >&2
              exit 2 ;;
            v*) ;;
            *)
              echo "Release version must start with 'v': $ver" >&2
              exit 2 ;;
          esac
          printf 'version=%s\n' "$ver" >> "$GITHUB_OUTPUT"

      - name: Download all target artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-dist-*
          path: downloaded-dist

      - name: Merge SHA256SUMS.txt, release-manifest.json, and installer
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp scripts/install-release.sh release-assets/install-release.sh
          chmod 755 release-assets/install-release.sh

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil

          version = os.environ["RELEASE_VERSION"]
          in_root = Path("downloaded-dist")
          out_dir = Path("release-assets")

          checksums = {}
          assets = {}
          commit = "unknown"

          for dist_dir in sorted(in_root.glob("release-dist-*")):
              for tarball in sorted(dist_dir.glob("blackbird-*.tar.gz")):
                  shutil.copy2(tarball, out_dir / tarball.name)
              sums_file = dist_dir / "SHA256SUMS.txt"
              if sums_file.is_file():
                  for line in sums_file.read_text(encoding="utf-8").splitlines():
                      parts = line.strip().split(None, 1)
                      if len(parts) == 2:
                          checksums[parts[1].lstrip("*").strip()] = parts[0].lower()
              manifest_file = dist_dir / "release-manifest.json"
              if manifest_file.is_file():
                  data = json.loads(manifest_file.read_text(encoding="utf-8"))
                  if data.get("commit") and commit == "unknown":
                      commit = data["commit"]
                  for asset in data.get("assets", []):
                      assets[asset["target"]] = asset

          if not checksums or not assets:
              raise SystemExit("No release tarballs or manifests found to publish")

          sums_lines = [f"{checksums[name]}  {name}\n" for name in sorted(checksums)]
          (out_dir / "SHA256SUMS.txt").write_text("".join(sums_lines), encoding="utf-8")

          merged_manifest = {
              "version": version,
              "commit": commit,
              "assets": [assets[t] for t in sorted(assets)],
          }
          (out_dir / "release-manifest.json").write_text(
              json.dumps(merged_manifest, indent=2) + "\n", encoding="utf-8"
          )
          PY

          (cd release-assets && sha256sum -c SHA256SUMS.txt)

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release upload "$RELEASE_VERSION" release-assets/* --clobber
          else
            gh release create "$RELEASE_VERSION" release-assets/* \
              --title "Blackbird ${RELEASE_VERSION}" \
              --generate-notes
          fi
